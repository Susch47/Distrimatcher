name: HTML-Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - name: Tests (JS port must match the Python reference)
        run: npm test
      - name: Build single HTML file
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Distrimatcher-HTML
          path: web/dist/Distrimatcher.html
          retention-days: 30
      - name: Publish as direct download (release "html")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete html --yes --cleanup-tag 2>/dev/null || true
          gh release create html dist/Distrimatcher.html --prerelease --target "$GITHUB_SHA" \
            --title "Distrimatcher – single HTML file" \
            --notes "One file, no installation, no server: save Distrimatcher.html and open it in Edge or Chrome. Built from $GITHUB_REF_NAME ($GITHUB_SHA)."
