name: Windows-Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tesseract-OCR (inkl. Deutsch) zum Mitliefern holen
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata" -OutFile "$src\tessdata\deu.traineddata"
          Copy-Item -Recurse $src packaging\tesseract
          "TESSERACT_CMD=$src\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tests
        run: python -m pytest -q

      - name: Programm bauen (PyInstaller)
        run: pyinstaller --noconfirm packaging/distrimatcher.spec

      - name: Assemble test package
        shell: pwsh
        run: |
          $out = "Distrimatcher-Test"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item -Recurse dist\Distrimatcher "$out\App"
          New-Item -ItemType Directory "$out\Test data" | Out-Null
          Copy-Item samples\demo_agreements.zip "$out\Test data\"
          Copy-Item samples\public_data\synthetic_fund_universe.csv "$out\Test data\Fund_list_with_retro.csv"
          Copy-Item packaging\INSTRUCTIONS.txt "$out\"
          Copy-Item "packaging\Start Distrimatcher.cmd" "$out\"
          Copy-Item "packaging\Update Distrimatcher.cmd" "$out\"

      - name: Smoke test of the built .exe
        shell: pwsh
        run: |
          $env:DISTRIMATCHER_DATA = "$env:RUNNER_TEMP\dm-data"
          $p = Start-Process -FilePath "Distrimatcher-Test\App\Distrimatcher.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 15
          $s = Invoke-RestMethod http://127.0.0.1:8799/api/status
          $s | ConvertTo-Json
          if (-not $s.ocr) { throw "OCR not available in the .exe" }
          $m = Invoke-RestMethod http://127.0.0.1:8799/api/manual
          if (-not $m.content) { throw "Manual missing in the .exe" }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: Distrimatcher-Windows
          path: Distrimatcher-Test
          retention-days: 30

      - name: Publish as direct download (release "test-build")
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path Distrimatcher-Test -DestinationPath Distrimatcher-Windows.zip
          gh release delete test-build --yes --cleanup-tag 2>$null
          $notes = "Latest test build from branch $env:GITHUB_REF_NAME (commit $env:GITHUB_SHA). Unzip into any folder and start 'Start Distrimatcher.cmd'. See INSTRUCTIONS.txt."
          gh release create test-build Distrimatcher-Windows.zip --prerelease --target $env:GITHUB_SHA --title "Distrimatcher – test build" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "release upload failed" }
